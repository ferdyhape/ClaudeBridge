<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ClaudeBridge</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/theme.css" />
<link rel="icon" type="image/svg+xml" href="/logo.svg" />
</head>
<body>

<header class="app-header">
  <div class="app-header-inner">
    <div class="brand">
      <span class="brand-mark">
        <img src="/logo.svg" alt="ClaudeBridge logo" />
      </span>
      <span class="brand-name">ClaudeBridge</span>
    </div>
    <nav class="app-nav">
      <a href="/" class="nav-link active">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7a4 4 0 1 0-3.9 5H9v3H6v3H3v-3.17a2 2 0 0 1 .59-1.42L11.1 6.9A4 4 0 0 1 15 7zM16.5 6.5h.01"/></svg>
        Account
      </a>
      <a href="/docs.html" class="nav-link">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C4 4.67 4.67 4 5.5 4H12v16H5.5A1.5 1.5 0 0 1 4 18.5v-13zM20 5.5c0-.83-.67-1.5-1.5-1.5H12v16h6.5a1.5 1.5 0 0 0 1.5-1.5v-13z"/></svg>
        Docs
      </a>
    </nav>
  </div>
</header>

<main class="app-main">
  <p class="eyebrow">Account</p>
  <h1 class="page-title">Login &amp; API Keys</h1>
  <p class="page-lede">Each account is kept fully isolated — its own credentials, history, and API keys.</p>

  <div class="mt-4" id="statusArea">
    <div class="loading-text"><span class="dot"></span> Loading…</div>
  </div>

  <!-- Logged-out state: login flow -->
  <template id="tpl-login">
    <div class="card">
      <p>Sign in with a Claude account (Pro, Max, or Team). Credentials stay on the server, scoped to this account only.</p>

      <button type="button" class="btn btn-primary mt-4" id="startLoginBtn">Start Login</button>

      <div class="stack mt-4 hidden" id="loginActive">
        <pre class="log-box" id="loginLogBox">Waiting for output…</pre>

        <div class="hidden" id="urlBox">
          <a href="#" target="_blank" rel="noopener" class="btn btn-primary login-url-btn" id="urlLink">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5M9 15 19 5M6 5H5a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-1"/></svg>
            Open login page
          </a>
        </div>

        <div class="field-row hidden" id="codeBox">
          <input type="text" class="text-input" id="codeInput" placeholder="Paste the code from the login page…" />
          <button type="button" class="btn btn-primary" id="codeSubmit">Send</button>
        </div>

        <div class="hidden" id="loginResult"></div>

        <div class="field-row">
          <button type="button" class="btn btn-ghost" id="cancelLoginBtn">Cancel</button>
          <button type="button" class="btn btn-ghost hidden" id="retryLoginBtn">Try again</button>
        </div>
      </div>
    </div>
  </template>

  <!-- Logged-in state: account info + API keys -->
  <template id="tpl-account">
    <div class="card">
      <div class="row-between">
        <div>
          <span class="badge badge-success"><span class="badge-dot"></span>login</span>
          <div class="mt-4" style="margin-top: 0.5rem; font-size: 0.875rem;">
            <strong id="accountEmail"></strong>
            <span id="accountOrg" style="color: var(--color-on-surface-variant)"></span>
          </div>
        </div>
        <button type="button" class="btn btn-danger-outline" id="logoutBtn">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h4M16 17l5-5-5-5M21 12H9"/></svg>
          Logout
        </button>
      </div>
    </div>

    <div class="card">
      <div class="row-between" style="justify-content: flex-start; gap: 0.5rem;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--color-primary)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7a4 4 0 1 0-3.9 5H9v3H6v3H3v-3.17a2 2 0 0 1 .59-1.42L11.1 6.9A4 4 0 0 1 15 7zM16.5 6.5h.01"/></svg>
        <h2 style="font-family: var(--font-display); font-size: 1rem; font-weight: 600; margin: 0;">API Keys</h2>
      </div>
      <p style="margin-top: 0.375rem;">Use a key to call the API directly, outside the browser. Shown once, at creation.</p>

      <div class="key-list mt-4" id="apiKeyList"></div>

      <div class="field-row mt-4">
        <input type="text" class="text-input" id="apiKeyNameInput" placeholder='Key name (e.g. "backup script")' />
        <button type="button" class="btn btn-ghost" id="createApiKeyBtn">Create new key</button>
      </div>

      <div class="new-key-box mt-4 hidden" id="newApiKeyBox"></div>
    </div>
  </template>
</main>

<script src="/js/account.js"></script>
</body>
</html>
